<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SensorGrid Monitoring</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>SensorGrid Monitoring System</h1>

    <div class="dashboard">

        <div class="card">
            <h2>Temperature</h2>
            <p id="temperature">-- °C</p>
        </div>

        <div class="card">
            <h2>Humidity</h2>
            <p id="humidity">-- %</p>
        </div>

        <div class="card">
            <h2>Pressure</h2>
            <p id="pressure">-- hPa</p>
        </div>

        <div class="card">
            <h2>Water Level</h2>
            <p id="waterLevel">-- %</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
